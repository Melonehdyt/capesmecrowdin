<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2f5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1824">
  <title>Reports · capes.localize</title>
  <meta name="description" content="Community localization platform for capes.me.">
  <link rel="stylesheet" href="public/css/style.css">
  <script defer src="public/js/theme.js"></script>
</head>
<body class="preload">
  <header data-nav></header>
  <main class="page">
    <div class="container wide route-page">
      <section class="page-intro"><div><p class="eyebrow">Insights</p><h1 class="page-title">Reports</h1><p class="muted">Review translation progress across projects and contributors.</p></div></section>
      <section class="grid grid-4" id="kpis" aria-label="Localization metrics"></section>
      <section class="report-grid">
        <div class="panel page-panel"><div class="section-heading"><div><p class="eyebrow">Last 14 days</p><h2 class="section-title">Words translated</h2></div></div><div class="bar-chart" id="barChart"></div></div>
        <div class="panel page-panel"><div class="section-heading"><div><p class="eyebrow">Completion</p><h2 class="section-title">Translation status</h2></div></div><div class="donut-wrap"><div class="donut" id="donut"></div><div class="legend" id="donutLegend"></div></div></div>
      </section>
      <section class="panel page-panel"><div class="section-heading"><div><p class="eyebrow">Coverage</p><h2 class="section-title">Progress by language</h2></div></div><div class="table-wrap"><table><thead><tr><th>Language</th><th>Completion</th><th>Approved</th><th>Translated</th><th>Remaining</th></tr></thead><tbody id="rLangBody"></tbody></table></div></section>
      <section class="panel page-panel"><div class="section-heading"><div><p class="eyebrow">Team</p><h2 class="section-title">Contributors</h2></div></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Contributor</th><th>Role</th><th>Languages</th><th>Words</th></tr></thead><tbody id="rContrib"></tbody></table></div></section>
    </div>
  </main>
  <footer data-footer></footer>
  <script type="module" src="dist/js/pages/reports.js"></script>
</body>
</html>
