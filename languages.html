<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2f5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1824">
  <title>Languages · capes.localize</title>
  <meta name="description" content="Community localization platform for capes.me.">
  <link rel="stylesheet" href="public/css/style.css">
  <script defer src="public/js/theme.js"></script>
</head>
<body class="preload">
  <header data-nav></header>
  <main class="page">
    <div class="container wide route-page">
      <section class="page-intro"><div><p class="eyebrow">Workspace settings</p><h1 class="page-title">Language catalog</h1><p class="muted">Maintain the languages available to localization projects.</p></div><button class="btn-primary" id="addLang" type="button" hidden>＋ Add language</button></section>
      <section class="grid grid-4" id="kpis" aria-label="Language overview"></section>
      <section class="panel page-panel">
        <div class="section-heading"><div><p class="eyebrow">Catalog</p><h2 class="section-title">Languages</h2></div><label class="search-field"><span class="sr-only">Search languages</span><input id="catalogSearch" type="search" placeholder="Search name or code" /></label></div>
        <div class="table-wrap"><table><thead><tr><th>Language</th><th>Code</th><th>Type</th><th>Projects</th><th></th></tr></thead><tbody id="catalogBody"></tbody></table></div>
      </section>
      <section class="panel page-panel"><div class="section-heading"><div><p class="eyebrow">Assignments</p><h2 class="section-title">Languages by project</h2></div></div><div class="project-chips" id="projectChips"></div></section>
    </div>
  </main>
  <footer data-footer></footer>
  <script type="module" src="dist/js/pages/languages.js"></script>
</body>
</html>
